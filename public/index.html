<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111b21">
  <title>Connect — Real-Time Messaging</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%2300a884'/><path d='M17 11.5a5.5 5.5 0 01-.6 2.5 5.5 5.5 0 01-5 3 5.5 5.5 0 01-2.4-.6L6 17.5l1.2-3.7a5.5 5.5 0 01-.6-2.4 5.5 5.5 0 013-5 5.5 5.5 0 012.4-.6h.3a5.5 5.5 0 015.2 5.2z' fill='white'/></svg>">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <nav id="rail" aria-label="Main navigation"></nav>
    <aside id="side" aria-label="List panel"></aside>
    <section id="main" aria-label="Main panel"></section>
  </div>
  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <div id="layers"></div>
  <div id="calllayer" class="calllayer">
    <video id="callremote" class="callvideo hide" autoplay playsinline></video>
    <video id="calllocal" class="calllocal hide" autoplay playsinline muted></video>
    <div class="callcenter">
      <div id="callavatar"></div>
      <h2 id="callname"></h2>
      <p id="callstatus" class="muted"></p>
    </div>
    <div class="callcontrols">
      <button class="ib big off-toggle" id="callmic" aria-label="Toggle microphone">🎤</button>
      <button class="ib big off-toggle" id="callcam" aria-label="Toggle camera">📷</button>
      <button class="ib big danger" id="callend" aria-label="End call">✕</button>
      <button class="ib big success hide" id="callaccept" aria-label="Accept call">✓</button>
      <button class="ib big danger hide" id="calldecline" aria-label="Decline call">✕</button>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
</body>
</html>
